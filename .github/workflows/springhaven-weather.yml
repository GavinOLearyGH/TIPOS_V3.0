name: Publish Springhaven forecast

on:
  schedule:
    - cron: '17 22,23 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: springhaven-weather
  cancel-in-progress: false

jobs:
  tomorrow:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Save tomorrow’s 10 a.m. forecast
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TZ: America/New_York
        run: |
          hour=$(date +%H)
          if [[ "$EVENT_NAME" == schedule && "$hour" != 22 && "$hour" != 23 ]]; then
            echo 'Scheduled run arrived after the publication window.'
            exit 0
          fi
          day=$(date -d tomorrow +%F)
          path="repos/$GH_REPO/contents/$day.json"
          if gh api "$path?ref=springhaven-weather" --silent; then
            echo "Forecast already locked for $day."
            exit 0
          fi
          node daily-challenge/tools/springhaven-forecast.mjs "$day" > forecast.json
          if [[ "$day" != "$(date -d tomorrow +%F)" ]]; then
            echo 'Forecast retrieval crossed the daily cutoff.'
            exit 1
          fi
          gh api --method PUT "$path" --silent -f branch=springhaven-weather \
            -f message="Lock Springhaven forecast for $day" -f content="$(base64 -w 0 forecast.json)"
