name: V3.0 RC Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  browser-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install test dependencies
        run: npm install
      - name: Generate V2 curriculum migration audit
        run: node scripts/import-v2-curriculum.mjs
      - name: Materialize V3.12 legacy library
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'v3.12-tip-library'
        run: |
          if [ -z "$(git status --porcelain -- js/coach/legacy-library-data.js)" ]; then
            echo "Legacy library already materialized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/coach/legacy-library-data.js
            git commit -m "V3.12 materialize V2 practice-ready curriculum"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Upload V2 curriculum migration audit
        uses: actions/upload-artifact@v4
        with:
          name: v3-12-curriculum-migration
          path: generated/
          retention-days: 7
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tip-server.log 2>&1 &
          echo $! > /tmp/tip-server.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tip-server.log
          exit 1
      - name: Run golfer journey validation
        run: npm run test:rc
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -d '{"state":"success","context":"V3.0 RC Validation","description":"Golfer journey browser validation passed"}'
      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -d '{"state":"failure","context":"V3.0 RC Validation","description":"Golfer journey browser validation failed"}'
