<!doctype html>
<html lang="en"><head><meta name="course-build" content="0.3.0-efcf2309df"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Irish Par · Cross Country Mode</title><link rel="stylesheet" href="./releases/0.3.0-efcf2309df/course/style.css"></head>
<body><main class="home">
<header><div class="brand">THE IRISH PAR</div><nav class="game-nav" aria-label="Game navigation"><a id="daily-home" href="../">Home</a><a id="practice-home" href="./">Practice</a></nav></header>
<section class="intro"><h1>Cross Country Mode</h1><p class="muted">Pick a tee box and a target green at Springhaven. Find your own route to the cup.</p></section>
<section class="cross-country-setup" aria-label="Choose your practice route">
<div class="cross-country-form">
<label>Starting hole<select id="starting-hole"></select></label>
<label>Tee box<select id="tee-box"></select></label>
<label>Target green<select id="target-green"></select></label>

<div class="actions"><a id="play-route" class="button" href="./play.html">Play route</a></div>
</div>
<figure class="cross-country-map"><canvas id="route-map" width="600" height="440" role="img" aria-label="Course map showing the starting tee and target green."></canvas><figcaption><span>● Starting tee</span><span>● Target green</span></figcaption></figure>
</section>
<p class="build-line" id="build-version"></p>
