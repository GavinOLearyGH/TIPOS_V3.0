<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0c1914" />
  <meta name="description" content="The Irish Par — build your golfer with TIP7, TIP9 and a journal that remembers." />
  <title>The Irish Par</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/execution.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="menuBtn" class="icon-button" type="button" aria-label="Open menu">☰</button>
      <a class="brand" href="#/home" aria-label="The Irish Par home">
        <span class="brand-mark">TIP</span>
        <span class="brand-name">THE IRISH PAR</span>
      </a>
      <span class="topbar-spacer" aria-hidden="true"></span>
    </header>

    <main id="view" class="main" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <a href="#/home" data-route="home" class="nav-item"><span class="nav-icon" aria-hidden="true">⌂</span><span>HOME</span></a>
      <a href="#/tip" data-route="tip" class="nav-item nav-item-tip"><span class="nav-tip-mark" aria-hidden="true">TIP</span><span>TIP</span></a>
      <a href="#/golfer" data-route="golfer" class="nav-item"><span class="nav-icon" aria-hidden="true">◉</span><span>GOLFER</span></a>
    </nav>
  </div>

  <dialog id="menuDialog" class="sheet-dialog">
    <div class="sheet-head">
      <div><div class="eyebrow">THE IRISH PAR</div><h2>Settings</h2></div>
      <button id="closeMenuBtn" class="icon-button" type="button" aria-label="Close menu">×</button>
    </div>
    <div class="settings-list">
      <button type="button" data-setting="about">How TIP Works</button>
      <button type="button" data-setting="export">Export Golfer</button>
      <button type="button" data-setting="restore">Restore Golfer</button>
      <button type="button" data-setting="import-v2">Import TIP OS V2</button>
      <button type="button" data-setting="reset">Reset Golfer</button>
    </div>
    <p class="version-note">TIPOS V3.0-D · TIP9</p>
  </dialog>

  <dialog id="entryDialog" class="sheet-dialog entry-dialog"><div id="entryDialogBody"></div></dialog>
  <input id="restoreFile" type="file" accept="application/json,.json" hidden />
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
  <script src="./pwa-register.js" defer></script>
</body>
</html>
